  <section class="auth-section">
    <div class="auth-card">
      <a href="index.html" class="auth-logo logo">Wills Assured</a>
      <h1 class="auth-title">Redeem Your Voucher</h1>
      <p class="auth-subtitle">Enter your voucher code below to unlock your will.</p>

      <div id="redeemForm">
        <div class="form-group">
          <label class="form-label" for="voucherCodeInput">Voucher Code</label>
          <input
            type="text"
            id="voucherCodeInput"
            class="form-input"
            placeholder="e.g. WA-XXXX-XXXX"
            autocomplete="off"
            spellcheck="false"
            style="text-transform:uppercase;letter-spacing:0.08em;"
          />
        </div>
        <p id="redeemNote" class="form-note"></p>
        <button id="redeemBtn" class="btn btn-primary btn-full" style="margin-top:8px;">Redeem Voucher &rarr;</button>
      </div>

      <p style="margin-top:20px;font-size:0.85rem;color:var(--muted);text-align:center;">
        Don't have an account? <a href="register.html" style="color:var(--primary);">Create one free &rarr;</a>
      </p>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
  <script>
    (async () => {
      // Auto-fill code from URL param
      const params = new URLSearchParams(window.location.search)
      const codeParam = params.get('code')
      const input = document.getElementById('voucherCodeInput')
      if (codeParam) input.value = codeParam.toUpperCase()

      // Require auth — validate code first, then save so it survives the register/login flow
      const { data: { user } } = await sb.auth.getUser()
      if (!user) {
        if (codeParam) {
          const note = document.getElementById('redeemNote')
          const btn  = document.getElementById('redeemBtn')
          btn.disabled    = true
          btn.textContent = 'Checking…'
          try {
            const checkResp = await fetch(
              'https://fgyqumgvmllhiqdmgrfc.supabase.co/functions/v1/check-voucher',
              { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZneXF1bWd2bWxsaGlxZG1ncmZjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzQ1NDYsImV4cCI6MjA5MjUxMDU0Nn0.GwQsnXsraNegEqdYASRwagOxMgyAZg2iNXzP3Syqii8' }, body: JSON.stringify({ code: codeParam.toUpperCase() }) }
            )
            const checkResult = await checkResp.json()
            if (!checkResp.ok) {
              note.style.color = 'var(--accent)'
              note.textContent = checkResult.error || 'Invalid voucher code.'
              btn.disabled    = false
              btn.textContent = 'Redeem Voucher →'
              return
            }
          } catch {
            // Network error — allow through and let redemption catch it
          }
          localStorage.setItem('wa_pending_voucher', codeParam.toUpperCase())
        }
        window.location.href = 'register.html'
        return
      }

      document.getElementById('redeemBtn').addEventListener('click', async () => {
        const code = input.value.trim().toUpperCase()
        const note = document.getElementById('redeemNote')
        const btn  = document.getElementById('redeemBtn')

        if (!code) {
          note.style.color = 'var(--accent)'
          note.textContent = 'Please enter your voucher code.'
          return
        }

        btn.disabled    = true
        btn.textContent = 'Redeeming…'
        note.textContent = ''

        try {
          const { data: { session } } = await sb.auth.getSession()
          const resp = await fetch(
            'https://fgyqumgvmllhiqdmgrfc.supabase.co/functions/v1/redeem-voucher',
            {
              method:  'POST',
              headers: {
                'Content-Type':  'application/json',
                'Authorization': `Bearer ${session.access_token}`,
              },
              body: JSON.stringify({ code }),
            }
          )
          const result = await resp.json()

          if (!resp.ok) {
            note.style.color = 'var(--accent)'
            note.textContent = result.error || 'Something went wrong. Please try again.'
            btn.disabled    = false
            btn.textContent = 'Redeem Voucher →'
            return
          }

          note.style.color = 'var(--teal)'
          note.textContent = '✓ Voucher redeemed! Redirecting to your dashboard…'
          setTimeout(() => { window.location.href = 'dashboard.html' }, 1500)

        } catch (err) {
          note.style.color = 'var(--accent)'
          note.textContent = 'Something went wrong. Please try again.'
          btn.disabled    = false
          btn.textContent = 'Redeem Voucher →'
        }
      })
    })()
  </script>
</body>
</html>
