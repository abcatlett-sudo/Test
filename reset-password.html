<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Wills Assured</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YEW9B8CT2Y"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YEW9B8CT2Y');
  </script>
</head>
<body>

  <nav class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo">Wills Assured</a>
    </div>
  </nav>

  <section class="auth-section">
    <div class="auth-card">

      <a href="index.html" class="auth-logo">Wills Assured</a>

      <div class="auth-header">
        <h1>Choose a new password</h1>
        <p>Enter a new password for your account.</p>
      </div>

      <form class="auth-form" id="resetPasswordForm" novalidate>

        <div class="form-group">
          <label for="newPassword">New password</label>
          <input
            type="password"
            id="newPassword"
            name="newPassword"
            placeholder="At least 8 characters"
            required
            autocomplete="new-password"
          />
        </div>

        <div class="form-group">
          <label for="confirmNewPassword">Confirm new password</label>
          <input
            type="password"
            id="confirmNewPassword"
            name="confirmNewPassword"
            placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
            required
            autocomplete="new-password"
          />
        </div>

        <button type="submit" class="btn btn-full">Update Password</button>

        <p class="form-note" id="resetPasswordNote"></p>

      </form>

    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="auth.js"></script>
</body>
</html>
